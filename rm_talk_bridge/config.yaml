name: RM Talk Bridge
version: "1.1.0"
slug: rm_talk_bridge
description: Live two-way talk between RM Protect and the UniFi Protect doorbell
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
map:
  - ssl:ro
ports:
  8086/tcp: 8086
ports_description:
  8086/tcp: Talk bridge (secure WebSocket)
options:
  protect_host: "10.7.10.1"
  protect_api_key: ""
  doorbell_id: ""
  ha_url: "https://homeassistant:8123"
  certfile: fullchain.pem
  keyfile: privkey.pem
  max_session_seconds: 300
  talk_video_quality: medium
schema:
  protect_host: str
  protect_api_key: password
  doorbell_id: str
  ha_url: url
  certfile: str
  keyfile: str
  max_session_seconds: int(30,1800)
  talk_video_quality: list(low|medium|high)
